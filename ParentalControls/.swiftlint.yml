# SwiftLint configuration.
#
# Philosophy: keep every rule that catches a real defect, and relax only the
# ones that fight this codebase's deliberate choices — chiefly long
# user-facing strings, which we prefer readable in source over wrapped.

included:
  - Sources

excluded:
  - .build
  - build

# Rules worth having beyond the defaults.
opt_in_rules:
  - array_init
  - closure_end_indentation
  - closure_spacing
  - collection_alignment
  - contains_over_filter_count
  - contains_over_filter_is_empty
  - contains_over_first_not_nil
  - discouraged_optional_boolean
  - empty_collection_literal
  - empty_count
  - empty_string
  - explicit_init
  - fallthrough
  - fatal_error_message
  - first_where
  - flatmap_over_map_reduce
  - force_unwrapping          # this code runs privileged; a crash is a bad failure mode
  - implicitly_unwrapped_optional
  - joined_default_parameter
  - last_where
  - legacy_multiple
  - literal_expression_end_indentation
  - lower_acl_than_parent
  - modifier_order
  - operator_usage_whitespace
  - prefer_self_in_static_references
  - prefer_self_type_over_type_of_self
  - redundant_nil_coalescing
  - redundant_type_annotation
  - sorted_first_last
  - static_operator
  - toggle_bool
  - unavailable_function
  - unneeded_parentheses_in_closure_argument
  - unowned_variable_capture
  - untyped_error_in_catch
  - vertical_parameter_alignment_on_call
  - yoda_condition

disabled_rules:
  # Trailing commas in multi-line literals keep diffs clean when adding keys,
  # which happens constantly in the profile payloads and block lists.
  - trailing_comma
  # SwiftUI view bodies are declarative; this fires constantly and adds nothing.
  - multiple_closures_with_trailing_closure
  - todo

line_length:
  # Long lines here are almost always one user-facing sentence. Wrapping them
  # hurts readability and makes the copy harder to review.
  warning: 140
  error: 300
  ignores_comments: true
  ignores_urls: true
  ignores_function_declarations: true
  ignores_interpolated_strings: true

function_body_length:
  warning: 70
  error: 120

type_body_length:
  warning: 320
  error: 450

file_length:
  warning: 450
  error: 700
  ignore_comment_only_lines: true

cyclomatic_complexity:
  warning: 14
  error: 20

identifier_name:
  min_length:
    warning: 2
    error: 1
  excluded:
    - id
    - up
    - to

nesting:
  type_level:
    warning: 2

force_unwrapping:
  severity: error

# Project-specific mistakes worth failing the build over.
custom_rules:
  payload_scope_must_be_system:
    name: "PayloadScope must be System"
    regex: '"PayloadScope"\s*:\s*"User"'
    message: "The DNS payload handler rejects user-scoped profiles ('profile must be scoped to system'). Use System."
    severity: error

  no_hardcoded_profile_identifier:
    name: "Use ProfileIdentity"
    regex: '"com\.familysafety\.parental"'
    message: "Use ProfileIdentity.prefix so profile generation and revert cannot drift apart."
    severity: warning

  unquoted_path_interpolation:
    name: "Unquoted path in a privileged script"
    regex: '-home /Users/\\\('
    message: "Interpolating an unquoted path into a root command caused a newline injection before. Use shellQuoted with a validated AccountName."
    severity: error
